# FULL-PLANE scan over [0, 250]^2 GeV at 0.5 GeV for the phase-diagram figures (validation/make_phase_diagrams.py).
# Same physics as exploratory.toml at 25x the point density. Outside the controlled region this is an extrapolation of
# the matching formulas, not a physical prediction.
[grid]
mh = [0.0, 250.0, 0.5]
mt = [0.5, 250.0, 0.5]       # M_t = 0 is not a valid input (the running starts at mu = M_t)

[physics]
prescription = "cw1"
matching = "extended"        # lambda with tree-level M_h^2 dependence (avoids lambda(M_t) < 0 at small M_h)
alpha3 = 0.1184
h0 = 67.4

[output]
path = "results/full_plane_cw1.csv"
label = "full plane [0,250]^2 GeV at 0.5 GeV (extrapolation outside the controlled region)"
